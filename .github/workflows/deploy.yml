name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Permissions required to publish the generated site to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Prevent outdated deployments from racing with the latest commit.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Fetch the source code for this commit.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Use the Node.js version supported by the project.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Install dependencies and generate the static dist/ directory.
      - name: Install dependencies
        run: npm install

      - name: Build Astro site
        run: npm run build

      # Package dist/ as the artifact consumed by the deploy job.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    # Deploy only after the static build and artifact upload succeed.
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Publish the uploaded artifact to GitHub Pages.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
